<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pick your dates and a budget from Toronto — somewhere ranks destinations by what the whole trip actually costs: flight, bed, and everything on the ground."
    />
    <meta name="theme-color" content="#1A1614" />
    <title>somewhere — pick your dates and a budget</title>

    <!-- Open Graph / Twitter card. og:image and og:url must be absolute — social
         scrapers don't resolve relative paths. Image lives at /og-image.png (1200×630). -->
    <meta property="og:title" content="somewhere" />
    <meta
      property="og:description"
      content="Destinations ranked by what the whole trip costs — flight, bed, and everything on the ground."
    />
    <meta property="og:image" content="https://somewhere-mvp.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://somewhere-mvp.vercel.app" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="somewhere" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="somewhere" />
    <meta
      name="twitter:description"
      content="Destinations ranked by what the whole trip costs — flight, bed, and everything on the ground."
    />
    <meta name="twitter:image" content="https://somewhere-mvp.vercel.app/og-image.png" />
    <!-- Pre-paint setup, run before React mounts so there's no flash of the wrong
         theme. Two independent things:
         1. Cycling accent — pick one of four and set the --ac tokens on <html>.
            Reshuffles every load (design intent).
         2. Ambient mode — resolve day vs night once from the client clock and set
            data-ambient on <html>. The ambient theme itself is desktop-only (its
            tokens are gated to >=1025px in index.css), so on phones/tablets the
            attribute is inert and the warm-dark theme still shows; that's also why
            theme-color is only re-synced on desktop widths (mobile chrome stays
            warm-dark). Page-load granularity — not re-evaluated on an interval.
            On localhost only, a ?theme=dark|light query forces night|day so both
            ambients can be checked without changing the system clock. Dev-only and
            deliberately not surfaced in the UI — production always follows the clock. -->
    <script>
      (function () {
        var docEl = document.documentElement
        var s = docEl.style

        var accents = [
          { ac: '#E8A33D', hi: '#F2B65C', lo: '#D8912C', rgb: '232, 163, 61' }, // amber
          { ac: '#E8735A', hi: '#F28E78', lo: '#D25E46', rgb: '232, 115, 90' }, // coral
          { ac: '#5FB3A1', hi: '#7BC9B8', lo: '#4B9A89', rgb: '95, 179, 161' }, // sea glass
          { ac: '#A88BD0', hi: '#BCA3DF', lo: '#8C71B6', rgb: '168, 139, 208' }, // dusk
        ]
        var a = accents[Math.floor(Math.random() * accents.length)]
        s.setProperty('--ac', a.ac)
        s.setProperty('--ac-hi', a.hi)
        s.setProperty('--ac-lo', a.lo)
        s.setProperty('--ac-rgb', a.rgb)

        var h = new Date().getHours()
        var mode = h >= 6 && h < 19 ? 'day' : 'night'

        // Dev-only override: on localhost, ?theme=dark|light forces night|day so
        // both ambients can be checked without touching the system clock. Never
        // active in production (gated on hostname), so it can't affect real users.
        var isLocalDev =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname === '[::1]' ||
          location.hostname === ''
        if (isLocalDev) {
          var forced = new URLSearchParams(location.search).get('theme')
          if (forced === 'dark' || forced === 'night') mode = 'night'
          else if (forced === 'light' || forced === 'day') mode = 'day'
        }

        docEl.setAttribute('data-ambient', mode)
        // Ambient paint only kicks in >=1025px, so only re-sync the browser-chrome
        // colour there; below that the page is warm-dark and keeps #1A1614.
        if (window.matchMedia && window.matchMedia('(min-width: 1025px)').matches) {
          var tc = document.querySelector('meta[name="theme-color"]')
          if (tc) tc.setAttribute('content', mode === 'day' ? '#a8d3ea' : '#0a1428')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
